<style>*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Roboto,sans-serif;background-color:#0f0f14;background-repeat:no-repeat;background-position:center;background-size:cover}.card{position:relative;width:100%;max-width:420px;background:rgba(255,255,255,.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 32px rgba(0,0,0,.4)}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.35);box-shadow:0 4px 20px rgba(0,0,0,.3)}.avatar-placeholder{background:rgba(255,255,255,.15)}.name{margin-top:16px;font-size:22px;font-weight:700;color:#fff;text-align:center}.bio{margin-top:8px;font-size:14px;color:rgba(255,255,255,.75);text-align:center;line-height:1.5}.links{margin-top:24px;width:100%;display:flex;flex-direction:column;gap:12px}.link-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 20px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:20px;color:#fff;text-align:center;text-decoration:none;font-size:15px;font-weight:500;transition:transform .15s ease,background .15s ease}.link-btn:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}.link-btn:active{transform:translateY(0)}.promo-footer{margin-top:16px;width:100%;max-width:420px;font-size:10px;color:rgba(255,255,255,.45);text-align:center;line-height:1.5}.promo-footer a{color:inherit;text-decoration:underline}@media(max-width:380px){.card{padding:24px 18px;border-radius:22px}.avatar{width:90px;height:90px}.name{font-size:19px}}</style>
